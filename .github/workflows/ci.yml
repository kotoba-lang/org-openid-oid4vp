name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test

      - run: clojure -M:lint

      # The :cljs branch is not covered by the JVM suite, and this library's one
      # reader conditional (form-encode) is a place the two hosts genuinely
      # differ. No npm dependency, so no install step.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g nbb
      - run: nbb --classpath src test/nbb_smoke.cljs
